[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfabric-stage1"
version = "0.1.0"
description = "UNO Q hardware and timing characterization harness for QFabric"
requires-python = ">=3.11"
dependencies = [
  "arduino-router-bridge>=0.5.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]

[project.scripts]
qf-stage1 = "qfabric_stage1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
